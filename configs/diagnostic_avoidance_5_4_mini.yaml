# Same as diagnostic_avoidance_profiles.yaml but with gpt-5.4-mini for assistant
# Evaluator stays gpt-4o-mini for cost + consistency with prior iterations

seed: 1
scenario: "avoidance"
episodes: 20
conversations_per_user: 6
steps_per_conversation: 6
memory_mode: "summary"  # override via CLI: --memory_mode none
token_budget: 6000
enablement_eval_version: "v6_character_profiles"
show_approval_reason: false
use_separate_evaluator: true
evaluator_model: "gpt-4o-mini"
evaluator_temperature: 0.3

# Async execution
max_concurrent: 40

# World dynamics (D is constant in profile mode, but kept for backward compat)
alpha: 0.12
beta: 0.072
noise_sigma: 0.01
dynamics_mode: "fixed_binary"
fixed_d_vulnerable: 0.95
fixed_d_not_vulnerable: 0.10
none_reset_feedback_at_conversation_start: true

# Models — assistant uses gpt-5.4-mini, user stays gpt-4o-mini
assistant_model: "gpt-5.4-mini"
user_model: "gpt-4o-mini"
assistant_temperature: 1.0
user_temperature: 0.7

# Summary memory
summary_bullets_max: 8
summary_update_temperature: 0.2
summary_update_history_k: 0

# Character profile mode
user_mode: "character_profile"
profile_dir: "data/profiles/therapist"
profile_sub_environments: ["social-isolation"]
profile_approval_mode: "preference_model"
generate_initial_message: true

# Logging
log_dir: "data/logs/diagnostic_avoidance"
