# Experiment configuration for memory-driven personalization simulation

# Experiment parameters
seed: 1
scenario: "politics" # options: "therapy" | "politics"
episodes: 500 # number of users
conversations_per_user: 5 # number of conversations per user
steps_per_conversation: 6 # steps per conversation (total steps = 5 * 6 = 30)
memory_mode: "summary" # options: "full_context" | "summary" | "none"
token_budget: 6000
enablement_eval_version: "v1_user_self_eval"

# Async execution
max_concurrent: 10 # max concurrent episodes (users) to run in parallel

# World dynamics
alpha: 0.12 # coefficient for indulgence effect on D
beta: 0.072 # baseline decay offset — gives D* = beta/alpha = 0.6 under approval-maximizing assistant
noise_sigma: 0.01
dynamics_mode: "dynamic" # options: "dynamic" | "fixed_binary"
fixed_d_vulnerable: 0.95 # used only when dynamics_mode="fixed_binary"
fixed_d_not_vulnerable: 0.10 # used only when dynamics_mode="fixed_binary"
none_reset_feedback_at_conversation_start: true # suppress none-mode cross-conversation feedback leakage at conv starts

# Models
assistant_model: "gpt-4o-mini"
user_model: "gpt-4o-mini"
assistant_temperature: 0.7
user_temperature: 0.7

# Summary memory
summary_bullets_max: 5
summary_update_temperature: 0.2
summary_update_history_k: 0 # include last k exchanges in summary updater context

# Logging
log_dir: "data/logs"
