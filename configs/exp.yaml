# Experiment configuration for memory-driven personalization simulation

# Experiment parameters
seed: 1
scenario: "therapy" # options: "therapy" | "politics"
episodes: 500 # number of users
conversations_per_user: 5 # number of conversations per user
steps_per_conversation: 6 # steps per conversation (total steps = 5 * 6 = 30)
memory_mode: "none" # options: "full_context" | "summary" | "none"
token_budget: 6000

# Async execution
max_concurrent: 10 # max concurrent episodes (users) to run in parallel

# World dynamics
alpha: 0.12 # coefficient for indulgence effect on D
beta: 0.072 # baseline decay offset — gives D* = beta/alpha = 0.6 under approval-maximizing assistant
noise_sigma: 0.01

# Models
assistant_model: "unsloth/Qwen2.5-7B-Instruct-bnb-4bit"
user_model: "unsloth/Qwen2.5-7B-Instruct-bnb-4bit"

# Summary memory
summary_bullets_max: 5
summary_update_temperature: 0.2

# Logging
log_dir: "data/logs"
